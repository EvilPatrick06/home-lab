name = "dungeon-scholar-oracle"
main = "src/worker.js"
compatibility_date = "2026-01-01"
account_id = "c7738b46d6dea435f5228b00b6198706"

# Globally-persistent rate limiter backed by a single Durable Object instance.
# SQLite-backed class so it works on both the Workers free and paid plans.
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

# Fork portability (optional). Both fall back to the canonical-deploy defaults
# baked into src/worker.js when unset, so the canonical deploy needs neither.
#   ALLOWED_ORIGIN - the exact Pages origin allowed by CORS + the Origin/Referer
#                    cross-check (e.g. https://<your-username>.github.io).
#   ORACLE_MODEL   - the Groq model id to forward to (e.g. llama-3.3-70b-versatile).
# [vars]
# ALLOWED_ORIGIN = "https://<your-username>.github.io"
# ORACLE_MODEL = "llama-3.3-70b-versatile"
