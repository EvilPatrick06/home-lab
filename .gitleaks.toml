# Gitleaks config for home-lab.
#
# Extends the bundled default ruleset and adds a NARROW allowlist for known
# false positives, so the secret-scan CI gate (.github/workflows/secret-scan.yml)
# stays green on the current tree while still catching real secrets. The path
# allowlist applies to both the push/PR working-tree scan (--no-git) and the
# weekly full-history scan.
#
# Add new false positives here (preferred) or, for a one-off, by fingerprint in
# .gitleaksignore. Keep the allowlist as tight as possible - never allowlist a
# real source dir that could hold credentials.

[extend]
useDefault = true

[allowlist]
description = "home-lab false-positive allowlist"
paths = [
  # Vendored, already-minified third-party bundles under the bmo web static dir
  # (e.g. xterm@5.5.0, alpine, socket.io): scanning them is pure noise - the
  # generic-api-key rule false-matched the minified identifier "FourKeyMap" in
  # xterm.min.js. Scoped to this known vendored directory rather than repo-wide,
  # so a secret inlined in any OTHER minified bundle (e.g. a frontend prod build)
  # is still caught by the gate.
  '''bmo/pi/web/static/js/.*\.min\.js$''',
  # Same vendored bundles at their PRE-REORG historical path. The 2026-06
  # reorg moved BMO-setup/pi/static/ -> bmo/pi/web/static/; the weekly
  # full-history sweep still re-hits xterm.min.js's "FourKeyMap" false
  # positive at the old path (commits 4aa30d38, a8982df1), so allowlist it
  # too. History-only: the file no longer exists in the current tree.
  '''BMO-setup/pi/static/js/.*\.min\.js$''',
  # Natural-language LLM prompt text (not a secret store): the generic-api-key
  # rule false-matched the prose "Cloud KMS key management".
  '''dungeon-scholar/src/prompts/google\.js$''',
]
