# Health-gated CI deploy of the bmo Pi services.
#
# Trigger model:
#   - workflow_run only fires from the workflow file on the DEFAULT branch
#     (master); a green "bmo / pi pytest" run on a master push is the gate.
#   - Auto-deploy is additionally opt-in via the BMO_AUTO_DEPLOY repo variable;
#     without it, only manual workflow_dispatch runs deploy.
#
# Auth model:
#   - The tailnet join is ephemeral (tailscale/github-action OAuth → tag:ci).
#   - SSH host-key verification is STRICT against the Pi's pinned public keys
#     (see the "Pin the Pi SSH host key" step) — not accept-new/TOFU.
#   - SSH auth is Tailscale SSH — no SSH-key secrets are stored anywhere.
#
# Idempotency:
#   - deploy.sh is idempotent: it exits 0 on "already deployed", so a re-run
#     (or a duplicated workflow_run) is a safe no-op.
#
# Dormant by design:
#   - Without TS_OAUTH_CLIENT_ID / TS_OAUTH_SECRET the gate job emits a notice
#     and the deploy job is skipped → the workflow lands GREEN, not red.
name: bmo / deploy
# zizmor: ignore[dangerous-triggers] workflow_run is intentional: the deploy job is gated and skips without TS_OAUTH secrets, and deploys a pinned SHA (see header).
on:  # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: ["bmo / pi pytest"]   # MUST match the `name:` in .github/workflows/bmo-pi-pytest.yml exactly
    types: [completed]
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Commit to deploy (default: origin/master HEAD)"
        required: false
permissions:
  contents: read
concurrency:
  group: bmo-deploy
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master' &&
       vars.BMO_AUTO_DEPLOY == 'true')
    outputs:
      has-secrets: ${{ steps.check.outputs.ok }}
      target: ${{ steps.check.outputs.target }}
    steps:
      - id: check
        env:
          HAS_ID: ${{ secrets.TS_OAUTH_CLIENT_ID != '' }}
          HAS_SECRET: ${{ secrets.TS_OAUTH_SECRET != '' }}
          DISPATCH_SHA: ${{ inputs.target_sha }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          ok=false; [ "$HAS_ID" = "true" ] && [ "$HAS_SECRET" = "true" ] && ok=true
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "$DISPATCH_SHA" ] && ! printf '%s' "$DISPATCH_SHA" | grep -qE '^[0-9a-fA-F]{7,40}$'; then
              echo "::error::target_sha must be 7-40 hex chars (or empty for origin/master HEAD)"; exit 1
            fi
            echo "target=$DISPATCH_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "target=$RUN_SHA" >> "$GITHUB_OUTPUT"
          fi
          [ "$ok" = "true" ] || echo "::notice::bmo deploy skipped — TS_OAUTH_CLIENT_ID / TS_OAUTH_SECRET secrets not configured."
  deploy:
    needs: gate
    if: needs.gate.outputs.has-secrets == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Join tailnet (ephemeral)
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: bmo.tail31b5d9.ts.net
      - name: Pin the Pi SSH host key (strict verification, no TOFU)
        # SECURITY 2026-07-02 — GitHub-hosted runners are ephemeral, so the
        # previous `accept-new` setting re-trusted whatever host key the far
        # end presented on EVERY run (trust-on-first-use with no memory).
        # Pre-seed the Pi's real host public keys (public data — safe to
        # commit) and require strict verification. If the Pi's host keys are
        # ever regenerated, refresh these lines from a trusted machine:
        #   ssh-keyscan bmo.tail31b5d9.ts.net
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cat >> ~/.ssh/known_hosts <<'PINNED'
          bmo.tail31b5d9.ts.net ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJy8vlvv7Tv1ojwlJP3myUOK/F/SFzIja7fv0mwaufPT
          bmo.tail31b5d9.ts.net ssh-rsa 
          bmo.tail31b5d9.ts.net ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBOmkUfxj7JJJsbIXNOuhx+u4QD7F0aFpWpzh3BiBRyyAFUCOWhMY5jS0yjsLYrUMDs4cezo73lGoFptFObdBuPA=
          PINNED
      - name: Run health-gated deploy on the Pi
        # $TARGET is passed via env (not interpolated into the script body) for
        # expression-injection hygiene.
        env:
          TARGET: ${{ needs.gate.outputs.target }}
        run: |
          # $TARGET is validated to ^[0-9a-fA-F]{7,40}$ (or empty) in the gate
          # job, so it cannot reach the remote shell as anything but a SHA.
          # Empty => no arg => deploy.sh defaults to origin/master HEAD.
          if [ -n "$TARGET" ]; then
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
              patrick@bmo.tail31b5d9.ts.net \
              "/home/patrick/home-lab/bmo/pi/scripts/deploy.sh $TARGET"
          else
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
              patrick@bmo.tail31b5d9.ts.net \
              "/home/patrick/home-lab/bmo/pi/scripts/deploy.sh"
          fi
