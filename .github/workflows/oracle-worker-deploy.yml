name: oracle-worker deploy

# Manual, tracked deploy of the dungeon-scholar Oracle Worker. Triggered on
# demand (workflow_dispatch) so the deploy is reproducible/auditable without
# auto-publishing on every push. Requires repo secret CLOUDFLARE_API_TOKEN
# (scoped to Workers Scripts:Edit for the dungeon-scholar-oracle worker).
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: oracle-worker

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: ./.github/actions/setup-node-project
        with:
          working-directory: oracle-worker
      - name: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
