name: oracle-worker CI

# Gates changes to the Cloudflare Worker that backs dungeon-scholar's Oracle
# (AI grading/chat). Builds the Worker without publishing (wrangler --dry-run,
# no token needed) and runs its test script.
on:
  push:
    paths:
      - 'oracle-worker/**'
      - '.github/workflows/oracle-worker-ci.yml'
  pull_request:
    paths:
      - 'oracle-worker/**'
      - '.github/workflows/oracle-worker-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: oracle-worker

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-project
        with:
          working-directory: oracle-worker
      - name: Typecheck (tsc)
        run: npm run typecheck
      - name: Validate Worker build (no publish)
        run: npx wrangler deploy --dry-run --outdir=dist
      - name: Tests
        run: npm test
