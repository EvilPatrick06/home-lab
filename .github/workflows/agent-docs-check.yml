name: agent-instructions drift check

# Flags when the canonical-pointer or a SYNC:agents block drifts across the five
# hand-maintained AI-assistant guides. (BMO-SUGGESTIONS 2026-06-22.)
on:
  push:
    paths:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'GEMINI.md'
      - '.github/copilot-instructions.md'
      - '.cursorrules'
      - 'scripts/check-agent-instructions.sh'
      - '.github/workflows/agent-docs-check.yml'
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'GEMINI.md'
      - '.github/copilot-instructions.md'
      - '.cursorrules'
      - 'scripts/check-agent-instructions.sh'
      - '.github/workflows/agent-docs-check.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: bash scripts/check-agent-instructions.sh
