name: Deploy Dungeon Scholar to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'dungeon-scholar/**'
      - '.github/workflows/dungeon-scholar-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./dungeon-scholar
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: ./.github/actions/setup-node-project
        with:
          working-directory: dungeon-scholar
      - run: npm run test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          # Optional Oracle proxy Worker (AI grading + chat). Unset secrets render
          # as empty strings and fork-triggered workflows never receive secrets,
          # so forks build with the Oracle disabled (local fallback) automatically.
          # See dungeon-scholar/docs/oracle-setup.md.
          VITE_ORACLE_ENDPOINT: ${{ secrets.VITE_ORACLE_ENDPOINT }}
          # GitHub Pages serves under /<repo-name>/. This owner's repo is
          # `home-lab` (monorepo), so we override the default. Forks whose
          # repo is named `dungeon-scholar` can delete this line entirely —
          # vite.config.js defaults to `/dungeon-scholar/`. Forks with any
          # other repo name should change `/home-lab/` here to `/<their-repo>/`.
          VITE_BASE: /home-lab/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./dungeon-scholar/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
