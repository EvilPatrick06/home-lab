name: CI hygiene guards

# Mechanical guards for repo-wide conventions previously checked only by hand:
# literal Node pins, unpinned actions, docs-index parity, the superpowers orphan,
# and missing permissions blocks. See scripts/check-ci-hygiene.sh.
on:
  push:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - "docs/**"
      - "scripts/check-ci-hygiene.sh"
      - ".nvmrc"
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - "docs/**"
      - "scripts/check-ci-hygiene.sh"
      - ".nvmrc"

permissions:
  contents: read

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - run: bash scripts/check-ci-hygiene.sh

  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa # v0.5.7
        with:
          inputs: .github/
          online-audits: "false"
          version: "1.26.1"
          advanced-security: "false"
