# Ensures 5e JSON cross-references (sourceId, mapId, etc.) resolve to declared `id` values.
name: dnd-app validate 5e

on:
  # No branch filter on push: this correctness gate must run on auto/<agent-id>
  # branch pushes too, so the integrator's "merge only green branches" check
  # sees a real signal instead of a silently-missing run (path filters +
  # cancel-in-progress concurrency keep per-branch cost bounded).
  push:
    paths:
      - 'dnd-app/**'
      - '.github/workflows/dnd-app-validate-5e.yml'
  pull_request:
    paths:
      - 'dnd-app/**'
      - '.github/workflows/dnd-app-validate-5e.yml'

defaults:
  run:
    working-directory: dnd-app

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-5e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js + install deps
        uses: ./.github/actions/setup-node-project
        with:
          working-directory: dnd-app

      - name: Validate 5e data cross-references
        run: npm run validate:5e
