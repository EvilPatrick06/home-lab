# Ensures 5e JSON cross-references (sourceId, mapId, etc.) resolve to declared `id` values.
name: dnd-app validate 5e

on:
  push:
    branches: [master]
    paths:
      - 'dnd-app/**'
      - '.github/workflows/dnd-app-validate-5e.yml'
  pull_request:
    paths:
      - 'dnd-app/**'
      - '.github/workflows/dnd-app-validate-5e.yml'

defaults:
  run:
    working-directory: dnd-app

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-5e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Node.js + install deps
        uses: ./.github/actions/setup-node-project
        with:
          working-directory: dnd-app

      - name: Validate 5e data cross-references
        run: npm run validate:5e
