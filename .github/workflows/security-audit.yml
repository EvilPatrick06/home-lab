name: Security audit

on:
  push:
    branches: [master]
    paths:
      - 'dnd-app/**'
      - 'bmo/**'
      - 'dungeon-scholar/**'
      - 'oracle-worker/**'
      - '.github/workflows/security-audit.yml'
  pull_request:
    paths:
      - 'dnd-app/**'
      - 'bmo/**'
      - 'dungeon-scholar/**'
      - 'oracle-worker/**'
      - '.github/workflows/security-audit.yml'
  schedule:
    - cron: "18 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dnd-npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dnd-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-project
        with:
          working-directory: dnd-app
      - name: npm audit (production deps, moderate+)
        run: npm run audit:ci

  bmo-bandit-ide:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: bmo/pi/.python-version
      - name: Install pinned audit tools (hash-verified)
        # SECURITY 2026-07-02 — bandit was installed with a floating `>=` and
        # pip-audit fully unpinned, so any newly published release (or a
        # compromised transitive dep) was auto-adopted at run time. Install the
        # pip-compile'd, hash-pinned manifest instead (--require-hashes fails
        # closed on any artifact drift), matching the repo's pin-and-verify
        # posture (SHA-pinned actions, hash-verified gitleaks). Update path:
        # bmo/pi/requirements-audit.in (Dependabot's pip ecosystem watches
        # /bmo/pi and keeps the compiled pins current).
        run: pip install --require-hashes -r bmo/pi/requirements-audit.txt
      - name: bandit on ide_app (high severity and up)
        run: bandit -r bmo/pi/ide_app --severity-level=high
      - name: bandit on full bmo/pi (informational, high severity)
        continue-on-error: true
        run: bandit -r bmo/pi --severity-level=high
      - name: pip-audit on bmo (informational)
        # pip-audit itself comes from the hash-pinned install step above.
        continue-on-error: true
        run: pip-audit -r bmo/pi/requirements.txt

  dungeon-scholar-npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dungeon-scholar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-project
        with:
          working-directory: dungeon-scholar
      - name: npm audit (production deps, moderate+; auth-bearing app)
        run: npm run audit:ci

  oracle-worker-npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: oracle-worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-project
        with:
          working-directory: oracle-worker
      - name: npm audit (production deps, moderate+; internet-facing worker)
        run: npm run audit:ci

  mobile-npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dnd-app/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-project
        with:
          working-directory: dnd-app/mobile
      - name: npm audit (production deps, moderate+; Expo/EAS toolchain)
        run: npm run audit:ci
