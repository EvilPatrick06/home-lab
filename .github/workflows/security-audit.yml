name: Security audit

on:
  push:
    branches: [master]
    paths:
      - 'dnd-app/**'
      - 'bmo/**'
      - 'dungeon-scholar/**'
      - 'oracle-worker/**'
      - '.github/workflows/security-audit.yml'
  pull_request:
    paths:
      - 'dnd-app/**'
      - 'bmo/**'
      - 'dungeon-scholar/**'
      - 'oracle-worker/**'
      - '.github/workflows/security-audit.yml'
  schedule:
    - cron: "18 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dnd-npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dnd-app
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: dnd-app/package-lock.json
      - run: npm ci
      - name: npm audit (production deps, moderate+)
        run: npm run audit:ci

  bmo-bandit-ide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install bandit
        run: pip install 'bandit[toml]>=1.8.0'
      - name: bandit on ide_app (high severity and up)
        run: bandit -r bmo/pi/ide_app --severity-level=high
      - name: bandit on full bmo/pi (informational, high severity)
        continue-on-error: true
        run: bandit -r bmo/pi --severity-level=high
      - name: pip-audit on bmo (informational)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r bmo/pi/requirements.txt

  dungeon-scholar-npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dungeon-scholar
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: dungeon-scholar/package-lock.json
      - run: npm ci
      - name: npm audit (production deps, moderate+; auth-bearing app)
        run: npm run audit:ci

  oracle-worker-npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oracle-worker
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: oracle-worker/package-lock.json
      - run: npm ci
      - name: npm audit (high+)
        run: npm audit --audit-level=high
