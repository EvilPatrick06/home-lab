name: Secret scan

# Authoritative server-side secret scan: a backstop that `git commit --no-verify`
# and a missing local gitleaks binary cannot bypass (see docs/logs SECURITY-LOG
# finding). Scans the working tree on every push + PR; a weekly scheduled run adds
# a full git-history sweep. Logged as the guaranteed scanner the .husky/pre-commit
# hook (best-effort, optional) was missing.

on:
  push:
  pull_request:
  workflow_dispatch:   # allow on-demand re-run (e.g. to verify a full-history sweep fix)
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC - full-history sweep

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          # Full history only for the scheduled sweep; push/PR scan the tree state.
          fetch-depth: ${{ github.event_name == 'schedule' && '0' || '1' }}
      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.28.0
          # Pin both the version AND the artifact hash: download the release
          # tarball to disk and verify its SHA-256 against the known-good digest
          # before extracting, so a tampered/republished release asset cannot be
          # executed by this (authoritative) secret-scan gate. Update SHA256 when
          # bumping VERSION (from gitleaks_${VERSION}_checksums.txt).
          SHA256=a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          echo "${SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xz -f /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          rm -f /tmp/gitleaks.tar.gz
          gitleaks version
      - name: Scan working tree (push / PR)
        if: github.event_name != 'schedule'
        run: gitleaks detect --no-git --config .gitleaks.toml --redact --no-banner -v --source .
      - name: Scan full history (scheduled)
        if: github.event_name == 'schedule'
        run: gitleaks detect --config .gitleaks.toml --redact --no-banner -v --source .
