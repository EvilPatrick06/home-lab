name: dnd-app CI

# Phase 28e.2 — gate dnd-app changes on lint + forbidden-patterns + tsc (both
# configs) + tests + build smoke + circular + audit. dead-code runs non-blocking
# until the knip baseline is clean. (Absorbed the former ci.yml's build smoke +
# artifact verify on 2026-05-30, then deleted ci.yml — this is now THE everyday
# dnd-app gate; tag-push release gating still lives in release.yml.)

on:
  push:
    paths:
      - 'dnd-app/**'
      # The shared-5e-sync test (scripts/audit/shared-5e-sync.test.ts) compares
      # dnd-app's 5e JSON against the bmo mirror, so a bmo-side-only edit must
      # also re-run this gate or a divergence would slip through.
      - 'bmo/pi/data/5e/**'
      - '.github/workflows/dnd-app-ci.yml'
  pull_request:
    paths:
      - 'dnd-app/**'
      # The shared-5e-sync test (scripts/audit/shared-5e-sync.test.ts) compares
      # dnd-app's 5e JSON against the bmo mirror, so a bmo-side-only edit must
      # also re-run this gate or a divergence would slip through.
      - 'bmo/pi/data/5e/**'
      - '.github/workflows/dnd-app-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dnd-app
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-project
        with:
          working-directory: dnd-app
      - name: Lint (biome)
        run: npm run lint
      - name: Forbidden patterns (28e.3-28e.7)
        run: npm run lint:forbidden
      - name: File size budget (god-file ratchet)
        run: npm run lint:file-size
      - name: Typecheck (web)
        run: npx tsc --noEmit -p tsconfig.web.json
      - name: Typecheck (node)
        run: npx tsc --noEmit -p tsconfig.node.json
      - name: Validate content schemas (33h)
        run: npm run validate:content
      - name: Locale parity (i18n)
        run: npm run i18n:check-parity
      - name: Doc-count drift guard
        run: npm run sync:doc-counts -- --check
      - name: IPC-surface drift guard
        run: npm run gen:ipc-surface -- --check
      # mobile/src/_shared is a committed sync copy of src/shared (Metro/EAS
      # bundle it in-tree). Guarded here (not only in the path-filtered mobile
      # CI) because the drift originates from DESKTOP-side src/shared changes.
      - name: Mobile shared-copy drift guard
        run: node mobile/scripts/sync-shared.mjs --check
      - name: Tests
        run: npm test
      # Build smoke (folded in from the former ci.yml) — catches Vite config /
      # lazy-route / missing-import failures that pure tsc + vitest miss.
      # electron-builder packaging stays release-only (release.yml).
      - name: Build (electron-vite)
        run: npx electron-vite build
      - name: Verify build artifacts
        run: |
          test -f out/main/index.js || { echo "missing out/main/index.js"; exit 1; }
          test -f out/renderer/index.html || { echo "missing out/renderer/index.html"; exit 1; }
      - name: Build (web SPA)
        run: npm run build:web
      - name: Verify web build artifacts
        run: |
          test -f dist-web/index.html || { echo "missing dist-web/index.html"; exit 1; }
          test -d dist-web/assets || { echo "missing dist-web/assets"; exit 1; }
      - name: Bundle size guard (13O)
        run: npm run check:bundle-size
      - name: Coverage baseline (28h)
        run: npm run test:coverage
      - name: Security audit
        run: npm run audit:ci
      - name: Circular deps
        run: npm run circular
      - name: No skipped tests (28e.7)
        run: |
          ! grep -rE --include='*.ts' --include='*.tsx' '\b(it|describe|test)\.(skip|todo)\b|\b(xit|xdescribe|xtest)\b' src/
      - name: Dead code (knip)
        run: npm run dead-code
        continue-on-error: true
      # Informational: surfaces the "bump Electron before EOL" reminder on every
      # run. Non-blocking (continue-on-error) — a near-/past-EOL Electron warns
      # but never fails the build. See docs/DEPENDENCIES.md → "Electron upgrade
      # cadence" and scripts/maintenance/electron-eol-check.mjs.
      - name: Electron EOL reminder
        run: npm run check:electron-eol
        continue-on-error: true
