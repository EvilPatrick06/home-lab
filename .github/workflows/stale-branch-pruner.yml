# Remote half of stale-branch-pruner: prune merged auto/* branches on origin.
# The local worktree/lock/notify.log cleanup stays on bmo as a cron
# (bmo/pi/scripts/stale-local-cleanup.sh) — a runner can't touch the Pi's
# working trees. See docs/SCHEDULED-TASK-MIGRATION.md.
name: stale-branch-pruner
on:
  schedule:
    - cron: '0 10 * * 0'   # ~Sun 04:00 America/Denver (cron is UTC; DST shifts ±1h)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stale-branch-pruner
  cancel-in-progress: false
jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (prune script)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Prune merged auto/* remote branches
        env:
          GH_TOKEN: ${{ secrets