name: Dungeon Scholar CI

on:
  push:
    paths:
      - 'dungeon-scholar/**'
      - '.github/workflows/dungeon-scholar-ci.yml'
  pull_request:
    paths:
      - 'dungeon-scholar/**'
      - '.github/workflows/dungeon-scholar-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./dungeon-scholar
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: ./.github/actions/setup-node-project
        with:
          working-directory: dungeon-scholar
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          VITE_BASE: /home-lab/
