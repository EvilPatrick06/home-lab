name: dungeon-scholar CI

# PR + push gate for dungeon-scholar (previously only gated by the deploy
# workflow on push to main). Runs the project's vitest suite and a production
# build so regressions are caught at PR time.
on:
  push:
    paths:
      - 'dungeon-scholar/**'
      - '.github/workflows/dungeon-scholar-ci.yml'
  pull_request:
    paths:
      - 'dungeon-scholar/**'
      - '.github/workflows/dungeon-scholar-ci.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dungeon-scholar
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: dungeon-scholar/package-lock.json
      - run: npm ci
      - name: Test (vitest)
        run: npm test
      - name: Build (vite)
        run: npm run build
