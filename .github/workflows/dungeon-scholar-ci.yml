name: Dungeon Scholar CI

on:
  push:
    paths:
      - 'dungeon-scholar/**'
      - '.github/workflows/dungeon-scholar-ci.yml'
  pull_request:
    paths:
      - 'dungeon-scholar/**'
      - '.github/workflows/dungeon-scholar-ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./dungeon-scholar
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-project
        with:
          working-directory: dungeon-scholar
      - run: npm run lint
      - name: Typecheck (tsc)
        run: npm run typecheck
      - run: npm run test
      - run: npm run build
        env:
          VITE_BASE: /home-lab/
      # --- Advisory budgets (report-only for now; see SUGGESTIONS-LOG "CI has no
      #     test-coverage floor and no bundle-size budget"). continue-on-error keeps
      #     them non-gating until the numbers prove stable, then drop the flag /
      #     set BUNDLE_BUDGET_STRICT=1 to make them block. ---
      - name: Bundle-size budget (advisory)
        continue-on-error: true
        run: npm run budget:bundle
      - name: Test coverage floor (advisory)
        continue-on-error: true
        run: npm run test:coverage
