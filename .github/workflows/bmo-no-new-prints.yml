name: bmo print() ratchet

# Production bmo/pi modules should use bmo_logging, not print(). This fails if
# the production print() count grows beyond bmo/pi/.print-baseline.
# (BMO-SUGGESTIONS 2026-06-22.)
on:
  push:
    paths:
      - 'bmo/pi/**/*.py'
      - 'bmo/pi/.print-baseline'
      - 'bmo/pi/.home-lab-literal-baseline'
      - 'bmo/pi/scripts/check-no-new-prints.sh'
      - 'bmo/pi/scripts/check-no-home-lab-literals.sh'
      - '.github/workflows/bmo-no-new-prints.yml'
  pull_request:
    paths:
      - 'bmo/pi/**/*.py'
      - 'bmo/pi/.print-baseline'
      - 'bmo/pi/.home-lab-literal-baseline'
      - 'bmo/pi/scripts/check-no-new-prints.sh'
      - 'bmo/pi/scripts/check-no-home-lab-literals.sh'
      - '.github/workflows/bmo-no-new-prints.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: bash bmo/pi/scripts/check-no-new-prints.sh
      - run: bash bmo/pi/scripts/check-no-home-lab-literals.sh
