# CI-failure -> board incident (no-LLM replacement for the ci-failure-triage Claude task).
#
# The moment a monitored CI workflow FAILS on master, surface a keyed incident on
# the BMO status board; when that workflow goes GREEN again, the incident
# self-clears. Deterministic - failed workflow name + run URL only, no LLM prose.
#
# Board access rides the existing Tailscale-SSH path (identical to bmo / deploy):
# join the tailnet with TS_OAUTH_CLIENT_ID/TS_OAUTH_SECRET, then run notify-board
# over Tailscale SSH. DORMANT BY DESIGN - without those secrets the post step is
# skipped and the run lands GREEN. See docs/SCHEDULED-TASK-MIGRATION.md.
name: ci-failure-triage
# zizmor: ignore[dangerous-triggers] workflow_run is intentional and branch-gated; the board step is env-plumbed and skips without TS_OAUTH secrets.
on:  # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows:
      - "bmo / pi pytest"
      - "bmo / docker build"
      - "bmo print() ratchet"
      - "CI hygiene guards"
      - "CodeQL"
      - "Secret scan"
      - "Security audit"
      - "dnd-app CI"
      - "dnd-app mobile CI"
      - "dnd-app validate 5e"
      - "dnd-app e2e (smoke)"
      - "Dungeon Scholar CI"
      - "oracle-worker CI"
      - "agent-instructions drift check"
    types: [completed]
permissions:
  contents: read
concurrency:
  group: ci-failure-triage-${{ github.event.workflow_run.name }}
  cancel-in-progress: false
jobs:
  board:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >
      github.event.workflow_run.head_branch == 'master' &&
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Check board access (dormant-green if absent)
        id: gate
        env:
          HAS_ID: ${{ secrets.TS_OAUTH_CLIENT_ID != '' }}
          HAS_SECRET: ${{ secrets.TS_OAUTH_SECRET != '' }}
        run: |
          ok=false; [ "$HAS_ID" = "true" ] && [ "$HAS_SECRET" = "true" ] && ok=true
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          [ "$ok" = "true" ] || echo "::notice::ci-failure-triage board post skipped - TS_OAUTH secrets not configured."
      - name: Checkout (board helper scripts)
        if: steps.gate.outputs.ok == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Join tailnet (ephemeral)
        if: steps.gate.outputs.ok == 'true'
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: bmo.tail31b5d9.ts.net
      - name: Post / clear board incident
        if: steps.gate.outputs.ok == 'true'
        env:
          WF_NAME: ${{ github.event.workflow_run.name }}
          WF_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WF_URL: ${{ github.event.workflow_run.html_url }}
          WF_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bash .github/scripts/ci-failure-board.sh
