name: Release

# Triggered by pushing a `v*` tag. Builds dnd-app on Windows + Linux and uploads to the
# tag's GitHub Release.
#
# Phase 14h — 4-job graph so the slow vitest run no longer blocks the electron-builder matrix:
#   1. checks-fast (ubuntu) — version-match + lint + typecheck (both tsconfigs). The gate `build`
#      waits on. NO vitest here.
#   2. test (ubuntu, sharded ×3) — vitest, runs IN PARALLEL with `build`.
#   3. build (matrix Win+Linux, needs checks-fast) — electron-builder with `--publish never`,
#      hands dist/* off as an artifact. (Ollama is no longer bundled — 14a.)
#   4. publish (ubuntu, needs [test, build]) — uploads the built assets + install-linux.sh to
#      the release, then verifies the 6 expected assets. Gated on BOTH tests and a clean build,
#      so a test-failing build never ships.
#
# The package.json version MUST match the tag (electron-builder names artifacts by it).
# `scripts/release/cut.mjs` handles the bump-commit-tag-push dance and pre-creates the release.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Never cancel a mid-publish release run; queue same-tag re-runs instead (§B5).
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  checks-fast:
    name: Fast checks (version + lint + typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dnd-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dnd-app/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Verify package.json version matches tag
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          TAG_VER="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VER" != "$TAG_VER" ]; then
            echo "::error::package.json version ($PKG_VER) does not match tag ($TAG_VER). Use scripts/release/cut.mjs to cut releases — it bumps package.json + package-lock.json before pushing the tag."
            exit 1
          fi
          echo "Version match: $PKG_VER"

      - name: Lint
        run: npm run lint

      - name: Typecheck (web tsconfig)
        run: npx tsc --noEmit -p tsconfig.web.json

      - name: Typecheck (node tsconfig)
        run: npx tsc --noEmit -p tsconfig.node.json

  test:
    name: Test (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: dnd-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dnd-app/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Test (shard ${{ matrix.shard }}/3)
        run: npx vitest run --shard=${{ matrix.shard }}/3

  build:
    name: Build (${{ matrix.os }})
    needs: checks-fast
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            builder-flag: '--win'
          - os: ubuntu-latest
            builder-flag: '--linux'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: dnd-app
    env:
      # Cache the Electron zip + winCodeSign/nsis/AppImage-tool downloads between runs (§B2).
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dnd-app/package-lock.json

      # Per-OS key — never share Win↔Linux electron-builder caches.
      - name: Cache Electron / electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.cache/electron
            ${{ github.workspace }}/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('dnd-app/package-lock.json') }}

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      # AppImage build needs GTK and friends on the runner for the bundled-binary smoke-test.
      - name: Linux build deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 \
            xdg-utils libatspi2.0-0 libuuid1 libsecret-1-0
        working-directory: .

      # Build the installer/AppImage but DO NOT publish — the `publish` job uploads after tests
      # pass, so a test-failing build never reaches users.
      - name: Build (no publish)
        run: |
          npm run build:index
          npx electron-vite build
          npx electron-builder ${{ matrix.builder-flag }} --publish never

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          # NOTE: explicit latest{,-linux}.yml — `*.yml` would also sweep up
          # `builder-debug.yml`, which is electron-builder's internal
          # file-glob dump and not useful to end users.
          path: |
            dnd-app/dist/*.exe
            dnd-app/dist/*.AppImage
            dnd-app/dist/latest.yml
            dnd-app/dist/latest-linux.yml
            dnd-app/dist/*.blockmap
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish + verify assets
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            release-assets/* \
            dnd-app/scripts/build/install-linux.sh \
            --clobber

      - name: Verify expected assets are present
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          EXPECTED=(
            "dnd-vtt-${VER}-setup.exe"
            "dnd-vtt-${VER}-setup.exe.blockmap"
            "dnd-vtt-${VER}-x86_64.AppImage"
            "latest.yml"
            "latest-linux.yml"
            "install-linux.sh"
          )
          echo "Expected assets:"
          printf '  %s\n' "${EXPECTED[@]}"
          PRESENT=$(gh release view "$GITHUB_REF_NAME" --repo "$REPO" --json assets --jq '.assets[].name')
          echo "Present assets:"
          echo "$PRESENT" | sed 's/^/  /'
          MISSING=()
          for asset in "${EXPECTED[@]}"; do
            if ! echo "$PRESENT" | grep -qFx "$asset"; then
              MISSING+=("$asset")
            fi
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Release $GITHUB_REF_NAME is missing ${#MISSING[@]} expected asset(s):"
            printf '::error::  - %s\n' "${MISSING[@]}"
            exit 1
          fi
          echo "All 6 platform/installer assets present (source tarballs auto-attach via GitHub)."

      # On failure only, keep a short-retention copy of the built binaries for debugging (§B4).
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-debug
          path: release-assets/*
          if-no-files-found: warn
          retention-days: 3
