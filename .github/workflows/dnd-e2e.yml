name: dnd-app e2e (smoke)

# Non-blocking: runs on PRs touching dnd-app and on manual dispatch only — NOT on
# every push — so it never gates the required dnd-app-ci on auto/* branches while
# the Playwright suite is still being grown. Promote to push/required once stable.
on:
  pull_request:
    paths:
      - "dnd-app/**"
      - ".github/workflows/dnd-e2e.yml"
  workflow_dispatch:

# Least-privilege: the job only reads the repo (no write scope needed). Without
# this block the token falls back to the repo/org default, which may be
# read-write. (Matches the contents: read convention of the sibling workflows.)
permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dnd-app
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: ./.github/actions/setup-node-project
        with:
          working-directory: dnd-app
      - run: npx playwright install --with-deps chromium
      - run: npm run build:web
      - run: npx playwright test
