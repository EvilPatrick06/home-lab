# PHASE-43 43B: CodeQL advanced setup. This is the ACTIVE and SOLE CodeQL
# configuration for the repo: GitHub "default setup" is OFF, so the verified
# non-production paths in .github/codeql/codeql-config.yml are excluded from
# extraction. Keep default setup OFF — re-enabling it would run both and produce
# duplicate scans. Runs on every push to master, every PR, and the weekly cron.
name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '18 5 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  # CodeQL is a security scanner: don't cancel in-flight runs during master
  # push bursts (auto/* branches consolidated by the integrator) so each merged
  # commit gets a completed analysis, not just the last commit in the burst.
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        # `actions` keeps the actions/missing-workflow-permissions family scanned.
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          category: '/language:${{ matrix.language }}'
