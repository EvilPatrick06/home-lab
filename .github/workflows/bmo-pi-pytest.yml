# Parity with local: cd bmo/pi && python -m pytest tests/ -q
name: bmo / pi pytest

on:
  # No branch filter on push: this correctness gate must run on auto/<agent-id>
  # branch pushes too, so the integrator's "merge only green branches" check
  # sees a real signal instead of a silently-missing run (path filters +
  # cancel-in-progress concurrency keep per-branch cost bounded).
  push:
    paths:
      - 'bmo/**'
      - '.github/workflows/bmo-pi-pytest.yml'
  pull_request:
    paths:
      - 'bmo/**'
      - '.github/workflows/bmo-pi-pytest.yml'

concurrency:
  group: bmo-pi-pytest-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: bmo/pi

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: bmo/pi/.python-version
          cache: pip
          cache-dependency-path: |
            bmo/pi/requirements-ci.txt
            bmo/pi/requirements-test.txt

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            portaudio19-dev \
            libsndfile1 \
            ffmpeg \
            vlc

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-ci.txt
          python -m pip install -r requirements-test.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Pytest
        env:
          BMO_SOCKETIO_ASYNC_MODE: threading
        run: python -m pytest tests/ -q
