# Build + deploy the dnd-app WEB build (Dungeon Table Online) to the Pi, which
# serves it same-origin behind the Cloudflare tunnel at
# https://bmo.mybmoai.work/DungeonTableOnline/ .
#
# Keeps the web version in lock-step with the desktop app: every master push
# that touches dnd-app rebuilds and redeploys the browser SPA.
#
# Auth model (identical to bmo-deploy.yml): ephemeral Tailscale OAuth join +
# Tailscale SSH — no SSH-key secrets stored. Dormant by design: without
# TS_OAUTH_CLIENT_ID / TS_OAUTH_SECRET the gate emits a notice and the deploy
# job is skipped, so the workflow lands GREEN, not red.
name: dnd-web / deploy
on:
  push:
    branches: [master]
    paths:
      - "dnd-app/**"
      - ".github/workflows/dnd-web-deploy.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dnd-web-deploy
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      has-secrets: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        env:
          HAS_ID: ${{ secrets.TS_OAUTH_CLIENT_ID != '' }}
          HAS_SECRET: ${{ secrets.TS_OAUTH_SECRET != '' }}
        run: |
          ok=false; [ "$HAS_ID" = "true" ] && [ "$HAS_SECRET" = "true" ] && ok=true
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          [ "$ok" = "true" ] || echo "::notice::dnd-web deploy skipped — TS_OAUTH secrets not configured."
  deploy:
    needs: gate
    if: needs.gate.outputs.has-secrets == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dnd-app
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-project
        with:
          working-directory: dnd-app
      # Gate the live deploy on green CI BEFORE building/rsyncing, mirroring the
      # inline test gate in dungeon-scholar-deploy.yml. dnd-app-ci.yml is the
      # authoritative gate but runs concurrently with this deploy, so without
      # these steps a commit that compiles yet fails lint / typecheck / vitest
      # could still be rsynced live. These re-run the core correctness checks so
      # a red result fails the deploy job before anything reaches the Pi.
      - name: Lint (biome)
        run: npm run lint
      - name: Typecheck (web)
        run: npx tsc --noEmit -p tsconfig.web.json
      - name: Typecheck (node)
        run: npx tsc --noEmit -p tsconfig.node.json
      - name: Tests
        run: npm test
      - name: Build web bundle
        run: npm run build:web
      - name: Join tailnet (ephemeral)
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: bmo.tail31b5d9.ts.net
      - name: Pin the Pi SSH host key (strict verification, no TOFU)
        # SECURITY 2026-07-02 — GitHub-hosted runners are ephemeral, so the
        # previous `accept-new` setting re-trusted whatever host key the far
        # end presented on EVERY run (trust-on-first-use with no memory).
        # Pre-seed the Pi's real host public keys (public data — safe to
        # commit) and require strict verification. If the Pi's host keys are
        # ever regenerated, refresh these lines from a trusted machine:
        #   ssh-keyscan bmo.tail31b5d9.ts.net
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cat >> ~/.ssh/known_hosts <<'PINNED'
          bmo.tail31b5d9.ts.net ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJy8vlvv7Tv1ojwlJP3myUOK/F/SFzIja7fv0mwaufPT
          bmo.tail31b5d9.ts.net ssh-rsa 
          bmo.tail31b5d9.ts.net ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBOmkUfxj7JJJsbIXNOuhx+u4QD7F0aFpWpzh3BiBRyyAFUCOWhMY5jS0yjsLYrUMDs4cezo73lGoFptFObdBuPA=
          PINNED
      - name: Rsync build to the Pi (retain old hashed chunks)
        # NO --delete: an active browser session keeps importing the PREVIOUS
        # build's content-hashed chunks (e.g. assets/InGamePage-<oldhash>.js)
        # until it reloads. Deleting them mid-session 404s those lazy imports
        # and hard-crashes the SPA to its error boundary. We overlay the new
        # build (new hashed files appear; index.html is rewritten to point at
        # them) and let a bounded, REFERENCE-AWARE retention sweep prune
        # genuinely-stale assets after a grace window, so the serve dir does not
        # grow unbounded.
        #
        # Retention is bounded (RETENTION_MINUTES, below) - the serve dir holds
        # roughly one grace-window's worth of deploys, NOT every build ever, so
        # it is self-limiting (not additive-without-pruning).
        #
        # The service worker (src/renderer/public/sw.js) precaches ONLY the app
        # shell + manifest - never the hashed assets/* chunks. Hashed assets are
        # fetched cache-first (immutable-by-hash) under per-version cache
        # namespaces that `activate` evicts, so no precache manifest can pin a
        # returning PWA user to a stale chunk hash.
        #
        # WEB-DEPLOY-1 (PHASE-61) - the age sweep alone was reference-BLIND: a
        # chunk byte-identical across >24h of builds keeps its content hash, so
        # rsync's size+mtime quick-check can SKIP re-transferring it, leaving the
        # Pi copy's mtime aged past the window - the sweep would then delete a
        # STILL-REFERENCED current chunk (404-ing a live SPA). Fix: after rsync,
        # explicitly refresh the mtime of every asset THIS build shipped, so the
        # current generation is always "young" and the age sweep can never match
        # it, regardless of whether rsync re-transferred the byte-identical file.
        env:
          # Grace window (minutes) old hashed assets survive a redeploy. Must
          # comfortably exceed a normal play session's "next lazy navigation"
          # gap so in-flight sessions can finish/reload. 1440 = 24h.
          RETENTION_MINUTES: "1440"
        run: |
          SSH='ssh -o BatchMode=yes -o StrictHostKeyChecking=yes'
          DEST=/home/patrick/web-apps/DungeonTableOnline
          $SSH patrick@bmo.tail31b5d9.ts.net "mkdir -p $DEST/assets"
          # Overlay the new build (rewrites index.html + adds new hashed chunks).
          rsync -az -e "$SSH" dist-web/ patrick@bmo.tail31b5d9.ts.net:$DEST/
          # Reference-aware guard: refresh the mtime of every asset this build
          # just shipped so the CURRENT generation is never older than the grace
          # window (even a byte-identical chunk rsync skipped re-transferring).
          # The basenames in the local dist-web/assets/ ARE the current module
          # graph, so touching their Pi counterparts excludes exactly the
          # referenced files from the age sweep below - no separate manifest diff.
          if [ -d dist-web/assets ]; then
            CURRENT_ASSETS="$(cd dist-web/assets && find . -maxdepth 1 -type f -printf '%f\n')"
            if [ -n "$CURRENT_ASSETS" ]; then
              printf '%s\n' "$CURRENT_ASSETS" \
                | $SSH patrick@bmo.tail31b5d9.ts.net \
                    "cd $DEST/assets && xargs -r -I{} touch -c -- '{}' && echo 'refreshed mtimes for current-generation assets'"
            fi
          fi
          # Bounded, reference-aware retention sweep: prune ONLY hashed files
          # under assets/ older than the grace window. The current generation was
          # just mtime-refreshed above, so it can never match
          # `-mmin +${RETENTION_MINUTES}` - only genuinely-superseded, past-grace
          # chunks are removed. index.html is not under assets/, never touched.
          $SSH patrick@bmo.tail31b5d9.ts.net \
            "find $DEST/assets -type f -mmin +${RETENTION_MINUTES} -delete -print | sed 's/^/pruned stale asset: /' || true"
